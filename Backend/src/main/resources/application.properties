#app
spring.application.name=attendance_system
server.port=8000

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=attendance_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT
app.jwt.secret=thisIsAVeryStrongSecretKeyForJwtTokenGeneration2024
app.jwt.expiration=86400000
